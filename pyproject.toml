[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tokcount"
version = "0.1.0"
description = "Count tokens in files and directories for different LLM models"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.15",
    "tiktoken>=0.8",
    "rich>=13",
]

[project.scripts]
tokcount = "tokcount.cli:app"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.9",
]
